name: Windows WPF packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-installer.yml
      - scripts/wpf/**
      - scripts/webview2-trial/**
      - LICENSE

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run offline verification
        shell: powershell
        run: dotnet run --configuration Release --project scripts/webview2-trial/verify/EBuild.Verification.csproj

      - name: Build WPF installer and portable ZIP
        shell: powershell
        run: |
          $innoSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          curl.exe -fLsS --retry 2 --connect-timeout 15 --max-time 120 $url -o $innoSetup
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Inno Setup.' }
          if ((Get-FileHash -LiteralPath $innoSetup).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') {
            throw 'SHA-256 mismatch for Inno Setup.'
          }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR="{0}"' -f $inno
          $process = Start-Process -FilePath $innoSetup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed ($($process.ExitCode))." }

          $output = Join-Path $env:RUNNER_TEMP 'EBuild-build'
          & .\scripts\wpf\package.ps1 -Output $output -Iscc (Join-Path $inno 'ISCC.exe')

      - name: Verify the packaged WPF interface
        shell: powershell
        run: |
          $launcher = Join-Path $env:RUNNER_TEMP 'EBuild-build\stage\EBuild-WPF.exe'
          dotnet run --configuration Release --project scripts/wpf/verify/EBuild.Wpf.Verification.csproj -- $launcher

      - name: Upload WPF packages and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: EBuild-WPF-Windows-x64
          path: ${{ runner.temp }}/EBuild-build/assets/
          compression-level: 0
          if-no-files-found: error
